services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dohoro
      POSTGRES_PASSWORD: dohoro
      POSTGRES_DB: dohoro_assignment
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dohoro -d dohoro_assignment']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://dohoro:dohoro@postgres:5432/dohoro_assignment
      JWT_SECRET: ${JWT_SECRET:-dev-secret-do-not-use-in-production}
      PORT: 3000
      NODE_ENV: development
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push && npm run db:seed && npm run dev"

volumes:
  postgres_data:
